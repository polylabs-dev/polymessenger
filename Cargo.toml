[workspace]
resolver = "2"
members = [
    "crates/q-core",
    "crates/q-sdk",
    "crates/q-messenger-wasm",
]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "LicenseRef-PolyQuantum-Commercial"
repository = "https://github.com/polylabs-dev/qmessenger"

[workspace.dependencies]
q-core = { path = "crates/q-core" }
q-sdk = { path = "crates/q-sdk" }
ml-kem = "0.2"
aes-gcm = "0.10"
sha3 = "0.10"
blake3 = "1"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"
bytes = "1"
hex = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
